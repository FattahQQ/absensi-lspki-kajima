<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Absensi LSPKI KAJIMA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>ABSENSI LSPKI KAJIMA</h2>
        <p class="welcome-text">Selamat Datang, <b id="userNama">User</b>!</p>
        
        <!-- Tambahan Elemen Pesan Notifikasi Visual -->
        <div id="notifikasi" style="display: none; padding: 10px; margin-bottom: 12px; border-radius: 6px; font-weight: bold; font-size: 13px;"></div>

        <div id="jam">00:00:00</div>
        
        <div class="action-buttons">
            <button id="btnMasuk">Absen Masuk</button>
            <button id="btnKeluar">Absen Keluar</button>
        </div>

        <button id="btnLogout">Logout</button>

        <div class="history-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3>Riwayat Kehadiran Anda</h3>
                <div>
                    <button id="btnExport" style="width: auto; padding: 6px 12px; font-size: 12px; background-color: #0f9d58; color: white;">
                        📥 Export CSV
                    </button>
                    <!-- Tambahan Tombol Reset -->
                    <button id="btnReset" style="width: auto; padding: 6px 10px; font-size: 12px; background-color: #d93025; color: white; margin-left: 4px;">
                        🗑️ Reset
                    </button>
                </div>
            </div>
            <ul id="daftarHadir"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
